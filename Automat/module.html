<style>
    /* Eigene Farben statt der des Hosts: liest sich auf hellem und dunklem Untergrund
       (Kachel-Visualisierung, IPSView). Dunkel ist Standard, „Helle Darstellung“ im Formular. */
    .au-wrap {
        --au-bg: #2b2d31;
        --au-text: #e8eaed;
        --au-el1: rgba(255, 255, 255, .07);
        --au-el2: rgba(255, 255, 255, .12);
        --au-primary: #4fc3f7;
        --au-warn: #ffb74d;
        --au-off: rgba(255, 255, 255, .45);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--au-bg);
        color: var(--au-text);
        border-radius: 12px;
        padding: 10px 10px 8px;
        box-sizing: border-box;
        min-height: 100%;
    }
    .au-wrap.au-light {
        --au-bg: #f4f5f7;
        --au-text: #1f2328;
        --au-el1: rgba(0, 0, 0, .06);
        --au-el2: rgba(0, 0, 0, .1);
        --au-primary: #0277bd;
        --au-warn: #b26a00;
        --au-off: rgba(0, 0, 0, .45);
    }
    .au-wrap button { font: inherit; color: inherit; cursor: pointer; }
    .au-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .au-chip {
        background: var(--au-el1); border: 1px solid transparent; border-radius: 999px;
        padding: 4px 11px; font-size: .82em; line-height: 1.25; white-space: nowrap;
    }
    .au-chip:hover { background: var(--au-el2); }
    .au-chip.on { border-color: var(--au-primary); }
    .au-chip.pause.on { border-color: var(--au-warn); color: var(--au-warn); }
    .au-room { font-size: .75em; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin: 10px 2px 4px; }
    .au-item { background: var(--au-el1); border-radius: 8px; padding: 7px 9px; margin-bottom: 5px; }
    .au-item.off { opacity: .55; }
    .au-top { display: flex; align-items: center; gap: 8px; }
    .au-ico { font-size: 1.15em; width: 1.4em; text-align: center; }
    .au-name { flex: 1; font-weight: 600; font-size: .92em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .au-btn {
        background: var(--au-el2); border: 1px solid transparent; border-radius: 6px;
        padding: 2px 8px; font-size: .78em; white-space: nowrap;
    }
    .au-btn.on { border-color: var(--au-warn); color: var(--au-warn); }
    .au-btn.perm.on { border-color: var(--au-primary); color: var(--au-primary); }
    .au-status { font-size: .8em; opacity: .85; margin: 3px 0 0 calc(1.4em + 8px); }
    .au-count { color: var(--au-primary); font-variant-numeric: tabular-nums; }
    .au-empty { opacity: .7; font-size: .9em; padding: 12px 4px; }
    .au-log { margin-top: 10px; font-size: .74em; opacity: .7; }
    .au-log summary { cursor: pointer; }
    .au-log div { margin: 2px 0; }
    .au-flash { font-size: .8em; color: var(--au-primary); min-height: 1.1em; margin: -2px 2px 4px; }
</style>
<div class="au-wrap" id="au-root"></div>
<script>
    var AU = null;
    var auMsg = '';
    var auTimer = null;

    function auEl(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) { e.className = cls; }
        if (text !== undefined && text !== null) { e.textContent = text; }
        return e;
    }

    function auSend(obj, msg) {
        auMsg = msg || '';
        requestAction('tile', JSON.stringify(obj));
        auRender();
        setTimeout(function () { auMsg = ''; auRender(); }, 3000);
    }

    function auRest(due) {
        if (!due || !AU) { return ''; }
        // Server-Zeit + vergangene Sekunden seit dem letzten Datenstand
        var now = AU.now + Math.floor((Date.now() - AU._recv) / 1000);
        var s = Math.max(0, due - now);
        if (s <= 0) { return ''; }
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return h > 0 ? (h + ' h ' + (m < 10 ? '0' : '') + m + ' min') : (m + ':' + (sec < 10 ? '0' : '') + sec);
    }

    function auRender() {
        var root = document.getElementById('au-root');
        if (!root || !AU) { return; }
        root.className = 'au-wrap' + (AU.light ? ' au-light' : '');
        root.innerHTML = '';

        var chips = auEl('div', 'au-chips');
        AU.modes.forEach(function (label, i) {
            var c = auEl('button', 'au-chip' + (AU.mode === i ? ' on' : ''), label);
            c.onclick = function () { if (AU.mode !== i) { auSend({ a: 'mode', v: i }, 'Hausmodus „' + label + '“ …'); } };
            chips.appendChild(c);
        });
        var p = auEl('button', 'au-chip pause' + (AU.paused ? ' on' : ''), AU.paused ? '⏸ pausiert' : '⏸ Pause');
        p.onclick = function () { auSend({ a: 'pause', v: !AU.paused }, AU.paused ? 'Pause wird beendet …' : 'Alle Automatismen werden pausiert …'); };
        chips.appendChild(p);
        root.appendChild(chips);
        root.appendChild(auEl('div', 'au-flash', auMsg));

        if (!AU.groups || AU.groups.length === 0) {
            root.appendChild(auEl('div', 'au-empty', 'Noch kein Automatismus eingerichtet — in der Instanz unter „Entdecken“ oder „Katalog“ anlegen.'));
        }
        (AU.groups || []).forEach(function (g) {
            root.appendChild(auEl('div', 'au-room', g.room));
            g.items.forEach(function (it) {
                var box = auEl('div', 'au-item' + (it.enabled ? '' : ' off'));
                var top = auEl('div', 'au-top');
                top.appendChild(auEl('span', 'au-ico', it.icon));
                var nm = auEl('span', 'au-name', it.name);
                nm.title = it.type;
                top.appendChild(nm);
                if (it.permanent !== null) {
                    var b1 = auEl('button', 'au-btn perm' + (it.permanent ? ' on' : ''), it.permanent ? '🔆 Dauerlicht' : '🔆');
                    b1.title = 'Dauerlicht';
                    b1.onclick = function () { auSend({ a: 'perm', uid: it.uid, v: !it.permanent }, it.permanent ? 'Dauerlicht aus …' : 'Dauerlicht an …'); };
                    top.appendChild(b1);
                }
                var b2 = auEl('button', 'au-btn' + (it.locked ? ' on' : ''), it.locked ? '🔒 gesperrt' : '🔓');
                b2.title = it.locked ? 'Sperre aufheben' : 'Sperren (tut dann nichts)';
                b2.onclick = function () { auSend({ a: 'lock', uid: it.uid, v: !it.locked }, it.locked ? 'Sperre wird aufgehoben …' : 'Wird gesperrt …'); };
                top.appendChild(b2);
                box.appendChild(top);
                var st = auEl('div', 'au-status', it.status);
                var rest = auRest(it.due);
                if (rest) {
                    st.appendChild(document.createTextNode(' · noch '));
                    st.appendChild(auEl('span', 'au-count', rest));
                }
                box.appendChild(st);
                root.appendChild(box);
            });
        });

        if (AU.log && AU.log.length) {
            var d = auEl('details', 'au-log');
            d.appendChild(auEl('summary', '', 'Protokoll'));
            AU.log.forEach(function (l) { d.appendChild(auEl('div', '', l)); });
            root.appendChild(d);
        }
    }

    function handleMessage(payload) {
        var data = (typeof payload === 'string') ? JSON.parse(payload) : payload;
        if (!data) { return; }
        data._recv = Date.now();
        AU = data;
        auRender();
        if (!auTimer) {
            // Restzeiten jede Sekunde mitlaufen lassen (offene Protokoll-Ansicht bleibt dabei erhalten)
            auTimer = setInterval(function () {
                var open = document.querySelector('.au-log[open]') !== null;
                auRender();
                if (open) { var x = document.querySelector('.au-log'); if (x) { x.open = true; } }
            }, 1000);
        }
    }
</script>
